<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>校园路面平整度地图</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html, body, #map { height: 100%; margin: 0; }
  #panel { position: absolute; top: 10px; left: 10px; z-index: 1000; background: #fff;
           padding: 12px 14px; border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.2);
           font-family: system-ui, "Microsoft YaHei", sans-serif; font-size: 13px; max-width: 280px; }
  #panel h3 { margin: 0 0 6px; font-size: 15px; }
  .lg { display: inline-block; width: 12px; height: 12px; border-radius: 3px;
        margin-right: 6px; vertical-align: -1px; }
  #worst { margin: 6px 0 0; padding-left: 18px; }
  #worst li { margin: 2px 0; }
  .muted { color: #888; }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <h3>校园路面平整度</h3>
  <div id="stats" class="muted">加载中…</div>
  <div style="margin-top:8px">
    <span class="lg" style="background:#2ecc71"></span>优　
    <span class="lg" style="background:#f39c12"></span>良　
    <span class="lg" style="background:#e74c3c"></span>差
  </div>
  <div class="muted" style="margin-top:4px">每格约 10×10 米；颜色越红，路面越颠簸（多趟数据融合）</div>
  <div style="margin-top:8px">最差网格 TOP5：<ol id="worst"></ol></div>
  <div style="margin-top:10px">
    <button id="reanalyze" style="font-size:13px;padding:5px 10px;border-radius:6px;
            border:1px solid #1e88e5;background:#e3f2fd;color:#1e88e5;cursor:pointer">
      🔄 重新分析数据</button>
    <div id="anaMsg" class="muted" style="margin-top:4px;font-size:12px;line-height:1.5"></div>
  </div>
  <div style="margin-top:8px"><a href="/points" style="color:#1e88e5;text-decoration:none">🎯 激励中心（积分排行）→</a></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// 瓦片服务：
//   'amap' = 高德（免 key、中文标注；非官方瓦片接口，仅课程演示用）
//   'osm'  = OpenStreetMap 官方瓦片（海外网络更稳）
// 校内加载慢就换另一项，或改用高德/百度官方 JS API。
const TILE_PROVIDER = 'amap';
const TILES = {
  amap: {url: 'https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',
         subdomains: '1234', attr: '© 高德地图'},
  osm:  {url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
         subdomains: '', attr: '© OpenStreetMap contributors'}
};
const COLORS = {'优': '#2ecc71', '良': '#f39c12', '差': '#e74c3c'};

// ── 坐标系转换（国内地图必做）─────────────────────────────
// GPS 设备输出 WGS-84；高德等国内瓦片是 GCJ-02（火星坐标），直接画会整体偏移 300~600 m。
// 数据库与分析保持 WGS-84 原始坐标，只在渲染时转换；OSM 瓦片为 WGS-84，自动跳过。
const NEED_GCJ = TILE_PROVIDER === 'amap';
const PI = Math.PI, AXIS = 6378245.0, EE = 0.00669342162296594323;

function outOfChina(lat, lon) {
  return lon < 72.004 || lon > 137.8347 || lat < 0.8293 || lat > 55.8271;
}
function transformLat(x, y) {
  let r = -100 + 2*x + 3*y + 0.2*y*y + 0.1*x*y + 0.2*Math.sqrt(Math.abs(x));
  r += (20*Math.sin(6*x*PI) + 20*Math.sin(2*x*PI)) * 2/3;
  r += (20*Math.sin(y*PI) + 40*Math.sin(y/3*PI)) * 2/3;
  r += (160*Math.sin(y/12*PI) + 320*Math.sin(y*PI/30)) * 2/3;
  return r;
}
function transformLon(x, y) {
  let r = 300 + x + 2*y + 0.1*x*x + 0.1*x*y + 0.1*Math.sqrt(Math.abs(x));
  r += (20*Math.sin(6*x*PI) + 20*Math.sin(2*x*PI)) * 2/3;
  r += (20*Math.sin(x*PI) + 40*Math.sin(x/3*PI)) * 2/3;
  r += (150*Math.sin(x/12*PI) + 300*Math.sin(x/30*PI)) * 2/3;
  return r;
}
function wgs84ToGcj02(lat, lon) {
  if (outOfChina(lat, lon)) return [lat, lon];
  let dLat = transformLat(lon - 105, lat - 35);
  let dLon = transformLon(lon - 105, lat - 35);
  const radLat = lat / 180 * PI;
  let magic = Math.sin(radLat);
  magic = 1 - EE * magic * magic;
  const sqrtMagic = Math.sqrt(magic);
  dLat = dLat * 180 / ((AXIS * (1 - EE)) / (magic * sqrtMagic) * PI);
  dLon = dLon * 180 / (AXIS / sqrtMagic * Math.cos(radLat) * PI);
  return [lat + dLat, lon + dLon];
}
function toTile(lat, lon) {
  return NEED_GCJ ? wgs84ToGcj02(lat, lon) : [lat, lon];
}

const map = L.map('map').setView([39.9042, 116.4074], 15);
const t = TILES[TILE_PROVIDER];
L.tileLayer(t.url, {subdomains: t.subdomains.split(''), attribution: t.attr, maxZoom: 19})
 .addTo(map);

const KEY = new URLSearchParams(location.search).get('key') || '';
const overlay = L.layerGroup().addTo(map);   // 旧渲染先清掉，便于重新分析后刷新

function render(d) {
  overlay.clearLayers();
  document.getElementById('worst').innerHTML = '';
  const segs = d.segments || [];
  if (!segs.length) {
    document.getElementById('stats').textContent =
      '暂无结果：点下方“🔄 重新分析数据”生成，或等骑手上传后再试。';
    return;
  }
  // 路线底图（灰色细线，画在下层）
  if (d.route && d.route.length > 1) {
    L.polyline(d.route.map(p => toTile(p[0], p[1])),
               {color: '#546e7a', weight: 3, opacity: .55}).addTo(overlay);
  }

  // 平整度网格：每个 10 m 格子按评级着色（颜色 = 多趟融合后的得分）
  const pts = [];
  segs.forEach(c => {
    const b = [toTile(c.bounds[0][0], c.bounds[0][1]),
               toTile(c.bounds[1][0], c.bounds[1][1])];
    L.rectangle(b, {
      color: COLORS[c.grade] || '#999', weight: 1, opacity: .7,
      fillColor: COLORS[c.grade] || '#999', fillOpacity: .55
    }).bindPopup(`网格 #${c.idx}　得分 ${c.score.toFixed(2)} m/s²<br>` +
                 `评级 ${c.grade}　${c.rides} 趟数据`).addTo(overlay);
    pts.push(toTile(c.lat, c.lon));
  });
  if (pts.length) map.fitBounds(pts, {padding: [30, 30]});

  const st = d.stats || {};
  document.getElementById('stats').innerHTML =
    `总里程 ≈ ${Math.round(st.route_len_m || 0)} m　有效趟数 ${st.rides || 0}<br>` +
    `网格数 ${st.cells || 0}（每格约 ${d.grid_m || 10} m）<br>` +
    `平整率（优+良网格占比）<b>${((st.paved_ratio || 0) * 100).toFixed(0)}%</b><br>` +
    ((st.excluded && st.excluded.length)
      ? `<span style="color:#e74c3c">已剔除异常会话 ${st.excluded.length} 个</span>`
      : '') +
    `<br><span class="muted">更新于 ${d.generated || '—'}</span>`;
  const worst = document.getElementById('worst');
  (st.worst || []).forEach(w => {
    const li = document.createElement('li');
    li.textContent = `#${w.idx} 得分 ${w.score.toFixed(2)}（${w.grade}）`;
    worst.appendChild(li);
  });
}

function load() {
  fetch('/api/segments?key=' + encodeURIComponent(KEY)).then(r => r.json())
    .then(render).catch(() => {
      document.getElementById('stats').textContent =
        '加载失败：确认服务端在运行，且地址带有正确的 key。';
    });
}

document.getElementById('reanalyze').onclick = async () => {
  const btn = document.getElementById('reanalyze');
  const msg = document.getElementById('anaMsg');
  btn.disabled = true;
  msg.style.color = '#888';
  msg.textContent = '正在分析，请稍候…（数据一般几秒钟）';
  try {
    const r = await fetch('/api/analyze?key=' + encodeURIComponent(KEY), {method: 'POST'});
    const d = await r.json();
    if (d.ok) {
      const s = d.summary || {};
      msg.style.color = '#2e7d32';
      msg.textContent = `✅ 分析完成：${s.cells || 0} 个网格 · 平整率 `
        + `${Math.round((s.paved_ratio || 0) * 100)}% · ${s.rides || 0} 趟有效`
        + (s.excluded ? ` · 剔除 ${s.excluded} 个异常` : '');
      load();
    } else {
      msg.style.color = '#c62828';
      msg.textContent = '⚠ ' + (d.error || '分析失败');
    }
  } catch (e) {
    msg.style.color = '#c62828';
    msg.textContent = '⚠ 请求失败：确认服务端在运行。';
  }
  btn.disabled = false;
};

load();
</script>
</body>
</html>
