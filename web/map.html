<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>校园路面平整度地图</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html, body, #map { height: 100%; margin: 0; }
  #panel { position: absolute; top: 10px; left: 10px; z-index: 1000; background: #fff;
           padding: 12px 14px; border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.2);
           font-family: system-ui, "Microsoft YaHei", sans-serif; font-size: 13px; max-width: 280px; }
  #panel h3 { margin: 0 0 6px; font-size: 15px; }
  .lg { display: inline-block; width: 12px; height: 12px; border-radius: 3px;
        margin-right: 6px; vertical-align: -1px; }
  #worst { margin: 6px 0 0; padding-left: 18px; }
  #worst li { margin: 2px 0; }
  .muted { color: #888; }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <h3>校园路面平整度</h3>
  <div id="stats" class="muted">加载中…</div>
  <div style="margin-top:8px">
    <span class="lg" style="background:#2ecc71"></span>优　
    <span class="lg" style="background:#f39c12"></span>良　
    <span class="lg" style="background:#e74c3c"></span>差
  </div>
  <div class="muted" style="margin-top:4px">每格约 10×10 米；颜色越红，路面越颠簸（多趟数据融合）</div>
  <div style="margin-top:8px">最差网格 TOP5：<ol id="worst"></ol></div>
  <div style="margin-top:10px">
    <button id="reanalyze" style="font-size:13px;padding:5px 10px;border-radius:6px;
            border:1px solid #1e88e5;background:#e3f2fd;color:#1e88e5;cursor:pointer">
      🔄 重新分析数据</button>
    <div id="anaMsg" class="muted" style="margin-top:4px;font-size:12px;line-height:1.5"></div>
  </div>
  <div style="margin-top:8px"><a href="/points" style="color:#1e88e5;text-decoration:none">🎯 激励中心（积分排行）→</a></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/static/map.js"></script>
</body>
</html>
